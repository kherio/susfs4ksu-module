name: Build WebUI

on:
  push:
    branches: ['webui']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webui branch
        uses: actions/checkout@v4
        with:
          ref: webui
          path: webui-src

      - name: Build
        working-directory: webui-src
        run: |
          npm ci || npm install
          npm run build

      - name: Checkout module branch
        uses: actions/checkout@v4
        with:
          ref: v1.5.2+
          path: module

      - name: Replace webroot with the new build
        run: |
          rm -rf module/webroot/*
          cp -r webui-src/dist/* module/webroot/

      - name: Commit and push
        working-directory: module
        run: |
          git config user.name "kherio"
          git config user.email "jvrsanjose@gmail.com"
          git add -A webroot
          if git diff --cached --quiet; then
            echo "Sin cambios en webroot"
          else
            git commit -m "WebUI: $(git -C ../webui-src log -1 --pretty=%s)"
            git push origin v1.5.2+
          fi
