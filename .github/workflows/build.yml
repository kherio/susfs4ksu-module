name: Build and Release

on:
  push:
    branches: ['v1.5.2+']
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar un Release en GitHub'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module.prop
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          SHORT=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHORT=${SHORT}" >> $GITHUB_ENV

      - name: Check scripts syntax
        run: for f in *.sh; do sh -n "$f"; done

      - name: Build zip
        run: |
          mkdir -p dist
          zip -qrD "dist/susfs4ksu-${VERSION}-${SHORT}.zip" . \
            -x '.git/*' '.github/*' 'dist/*' 'README.md' 'LICENSE' '.gitignore'
          cp "dist/susfs4ksu-${VERSION}-${SHORT}.zip" dist/susfs4ksu.zip
          unzip -l dist/susfs4ksu.zip | tail -1

      - name: Check cloud binary against trusted_hashes.txt
        run: |
          curl -fsSL https://raw.githubusercontent.com/sidex15/susfs4ksu-binaries/universal-binary/ksu_susfs_arm64 -o /tmp/ksu_susfs_cloud
          H=$(sha256sum /tmp/ksu_susfs_cloud | awk '{print $1}')
          if grep -q "^$H" trusted_hashes.txt; then
            echo "Cloud binary $H is trusted"
          else
            echo "::warning::El binario de la nube ($H) no esta en trusted_hashes.txt; los usuarios no podran actualizarlo hasta que lo revises y lo anadas"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-${{ env.VERSION }}-${{ env.SHORT }}
          path: dist/*.zip

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}-${SHORT}" dist/*.zip \
            --target "${GITHUB_SHA}" \
            --title "SUSFS4KSU ${VERSION} (${SHORT})" \
            --notes-file CHANGELOG.md
